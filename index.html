<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Old Eagle (OEAG)</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #050505;
    color: white;
    text-align: center;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 30px 20px 50px;
}

.language {
    text-align: right;
    margin-bottom: 20px;
}

.language button {
    padding: 9px 15px;
    margin: 3px;
    border: 1px solid #555;
    border-radius: 8px;
    background: #222;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

.language button:hover {
    background: #444;
}

.logo {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    margin-bottom: 20px;
}

h1 {
    font-size: 42px;
    margin: 10px 0;
}

.symbol {
    font-size: 24px;
    color: #aaa;
}

.card {
    margin-top: 30px;
    padding: 25px;
    border: 1px solid #333;
    border-radius: 15px;
    background: #111;
}

.info {
    margin: 12px 0;
}

a {
    display: inline-block;
    margin: 10px;
    padding: 12px 20px;
    border-radius: 8px;
    background: white;
    color: black;
    text-decoration: none;
    font-weight: bold;
}

.address {
    word-break: break-all;
    font-size: 13px;
    color: #aaa;
}

.description {
    margin-top: 25px;
    font-size: 18px;
    line-height: 1.8;
}

.whitepaper {
    margin-top: 20px;
}

[dir="rtl"] {
    direction: rtl;
}

[dir="rtl"] .language {
    text-align: left;
}
</style>
</head>

<body>

<div class="container" id="page">

<div class="language">
    <button onclick="setLanguage('en')">🇬🇧 English</button>
    <button onclick="setLanguage('fa')">🇮🇷 فارسی</button>
</div>

<img class="logo"
src="https://raw.githubusercontent.com/aliarefialiarefi69/old-eagle-logo/main/old_eagle_256x256_transparent.png"
alt="Old Eagle Logo">

<h1>OLD EAGLE</h1>
<div class="symbol">OEAG</div>

<div class="card">

<div class="info">
<strong id="networkLabel">Network:</strong> TON
</div>

<div class="info">
<strong id="supplyLabel">Total Supply:</strong> 1,000,000,000 OEAG
</div>

<div class="info">
<strong id="decimalsLabel">Decimals:</strong> 9
</div>

<div class="info">
<strong id="ownershipLabel">Ownership:</strong> Revoked
</div>

<h3 id="addressTitle">Jetton Master Address</h3>

<div class="address">
EQD3mKySkhoK02UCAyuMraeofLt0I1Ox2Y8EJ671tSRSH__M
</div>

<br>

<a id="buyButton"
href="https://app.ston.fi/swap?ft=TON&tt=EQD3mKySkhoK02UCAyuMraeofLt0I1Ox2Y8EJ671tSRSH__M">
BUY OEAG
</a>

</div>

<p class="description" id="description">
Old Eagle is a community-driven digital token on the TON blockchain.
</p>

<div class="whitepaper">
<a id="whitepaperButton" href="whitepaper.html">
📄 Read the Old Eagle Whitepaper
</a>
</div>

</div>

<script>

function setLanguage(lang) {

    if (lang === "fa") {

        document.documentElement.lang = "fa";
        document.documentElement.dir = "rtl";

        document.title = "عقاب پیر (OEAG)";

        document.getElementById("networkLabel").innerText = "شبکه:";
        document.getElementById("supplyLabel").innerText = "کل عرضه:";
        document.getElementById("decimalsLabel").innerText = "اعشار:";
        document.getElementById("ownershipLabel").innerText = "مالکیت:";
        document.getElementById("addressTitle").innerText = "آدرس جتون مستر";

        document.getElementById("buyButton").innerText = "خرید OEAG";

        document.getElementById("description").innerText =
        "Old Eagle یک توکن دیجیتال جامعه‌محور بر بستر بلاکچین TON است.";

        document.getElementById("whitepaperButton").innerText =
        "📄 مطالعه وایت‌پیپر Old Eagle";

    } else {

        document.documentElement.lang = "en";
        document.documentElement.dir = "ltr";

        document.title = "Old Eagle (OEAG)";

        document.getElementById("networkLabel").innerText = "Network:";
        document.getElementById("supplyLabel").innerText = "Total Supply:";
        document.getElementById("decimalsLabel").innerText = "Decimals:";
        document.getElementById("ownershipLabel").innerText = "Ownership:";
        document.getElementById("addressTitle").innerText = "Jetton Master Address";

        document.getElementById("buyButton").innerText = "BUY OEAG";

        document.getElementById("description").innerText =
        "Old Eagle is a community-driven digital token on the TON blockchain.";

        document.getElementById("whitepaperButton").innerText =
        "📄 Read the Old Eagle Whitepaper";
    }
}

</script>

</body>
</html>
