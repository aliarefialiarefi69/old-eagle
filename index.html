<style>
* {

}

html {

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #ffffff;
    background: #050914;

}

.container {
    width: 92%;
    max-width: 1100px;
    margin: auto;
}

header {
    padding: 20px 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
}

.nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.brand {
    font-size: 22px;
    font-weight: 900;
}

.brand span {
    color: #00e5ff;
}

.lang {
    display: flex;

}

.lang a {
    color: #ffffff;

}

.hero {

}

.logo {

    margin-bottom: 25px;
    background: #000000;
}

h1 {
    font-size: clamp(40px, 8vw, 72px);
    line-height: 1.05;
    margin-bottom: 15px;
}

.subtitle {
    color: #aeb9c9;
    max-width: 700px;
    margin: auto;
    font-size: 18px;
}

.buttons {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 30px;
}

.btn {
    display: inline-block;
    padding: 13px 22px;
    border-radius: 30px;
    text-decoration: none;
    color: #ffffff;
    font-weight: bold;
    border: 1px solid #263244;
    background: #111827;
}

.btn.primary {
    background: #00b8d4;
    border-color: #00e5ff;
    color: #001014;
}

section {
    padding: 45px 0;
}

.card {
    background: #0b1220;
    border: 1px solid #1d2a3d;
    border-radius: 18px;
    padding: 28px;
    margin-bottom: 20px;
}

h2 {
    font-size: 30px;
    margin-bottom: 18px;
}

h3 {
    margin-bottom: 8px;
    color: #00e5ff;
}

p {
    color: #b9c4d3;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.stat {
    text-align: center;
    background: #0b1220;
    border: 1px solid #1d2a3d;
    border-radius: 16px;
    padding: 25px 15px;
}

.stat strong {
    display: block;
    font-size: 24px;
    color: #ffffff;
    margin-bottom: 5px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.contract {
    word-break: break-all;
    font-family: monospace;
    background: #050914;
    border: 1px solid #1d2a3d;
    padding: 15px;
    border-radius: 10px;
    margin-top: 12px;
    color: #8defff;
}

footer {
    text-align: center;
    padding: 35px 0;
    border-top: 1px solid rgba(255,255,255,0.08);
    color: #778398;
}

@media (max-width: 700px) {
    .stats,
    .grid {
        grid-template-columns: 1fr;
    }

    .logo {
        width: 180px;
        height: 180px;
    }

    .hero {
        padding-top: 45px;
    }
}
</style>
