<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Old Eagle (OEAG) — Whitepaper</title>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    background: #050505;
    color: #f5f5f5;
    font-family: Tahoma, Arial, sans-serif;
    line-height: 2;
}

/* Language Buttons */
.language-switch {
    display: flex;
    justify-content: center;
    gap: 18px;
    padding: 30px 15px;
    direction: ltr;
}

.language-switch button {
    min-width: 150px;
    padding: 14px 25px;
    border: 1px solid #444;
    border-radius: 14px;
    background: #171717;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    transition: 0.25s;
}

.language-switch button:hover {
    background: #252525;
    border-color: #777;
    transform: translateY(-2px);
}

.language-switch button.active {
    background: #292929;
    border-color: #888;
}

/* Main */
.page {
    max-width: 900px;
    margin: auto;
    padding: 10px 20px 60px;
}

/* Header */
.hero {
    text-align: center;
    background: linear-gradient(145deg, #111827, #080b11);
    border: 1px solid #222;
    border-radius: 0 0 30px 30px;
    padding: 55px 25px;
    margin-bottom: 35px;
}

.logo {
    font-size: 70px;
    margin-bottom: 10px;
}

.hero h1 {
    margin: 0;
    font-size: 42px;
    letter-spacing: 1px;
}

.hero p {
    margin: 10px 0 0;
    color: #bdbdbd;
    font-size: 18px;
}

/* Cards */
.card {
    background: #101010;
    border: 1px solid #292929;
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
}

.card h2 {
    margin-top: 0;
    padding-bottom: 12px;
    border-bottom: 1px solid #333;
    font-size: 25px;
}

.card p {
    color: #dedede;
    font-size: 17px;
}

.card ul {
    padding-right: 25px;
}

.card li {
    margin-bottom: 8px;
    color: #ddd;
}

/* Persian */
#persian {
    direction: rtl;
    text-align: right;
}

#persian .card h2 {
    color: #ffffff;
    font-weight: bold;
}

#persian .card p,
#persian .card li {
    font-size: 17px;
    line-height: 2.2;
}

#persian strong {
    color: #fff;
}

/* English */
#english {
    direction: ltr;
    text-align: left;
    display: none;
}

#english .card ul {
    padding-left: 25px;
    padding-right: 0;
}

/* Contract */
.contract {
    background: #080808;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 15px;
    word-break: break-all;
    font-family: monospace;
    color: #ddd;
    direction: ltr;
    text-align: left;
}

/* Footer */
.footer {
    text-align: center;
    color: #777;
    padding: 30px 10px;
    font-size: 14px;
}
